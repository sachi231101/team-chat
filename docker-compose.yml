services:
  postgres:
    image: postgres:16-alpine
    container_name: teamchat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: teamchat
    ports:
      - '5432:5432'
    volumes:
      - teamchat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d teamchat']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  teamchat_pgdata:
