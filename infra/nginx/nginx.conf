worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 25m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    log_format main '$remote_addr - $host [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: http: https:; connect-src 'self' ws: wss: https://fonts.googleapis.com https://fonts.gstatic.com; frame-ancestors 'self'" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        location /api/identity/ {
            limit_req zone=api burst=40 nodelay;
            limit_conn conn 20;
            set $identity_upstream identity-api:3000;
            rewrite ^/api/identity/(.*) /$1 break;
            proxy_pass http://$identity_upstream;
            proxy_http_version 1.1;
        }

        location /api/workplace/ {
            limit_req zone=api burst=40 nodelay;
            limit_conn conn 20;
            set $workplace_upstream workplace-api:3000;
            rewrite ^/api/workplace/(.*) /$1 break;
            proxy_pass http://$workplace_upstream;
            proxy_http_version 1.1;
        }

        location /socket.io/ {
            set $chat_upstream team-chat-api:3000;
            proxy_pass http://$chat_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location /api/ {
            limit_req zone=api burst=80 nodelay;
            limit_conn conn 40;
            set $chat_upstream team-chat-api:3000;
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://$chat_upstream;
            proxy_http_version 1.1;
            client_max_body_size 25m;
        }

        location / {
            set $web_upstream web:80;
            proxy_pass http://$web_upstream;
            proxy_http_version 1.1;
        }
    }
}
